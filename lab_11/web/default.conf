# Конфигурация nginx для лабораторной работы №11.
# Кастомный формат журнала access.log с полем X-Forwarded-For:
# реальный адрес клиента ($remote_addr) и «внешний» адрес из заголовка XFF.

log_format lab11 '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 'xff="$http_x_forwarded_for"';

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html index.htm;

    access_log /var/log/nginx/access.log lab11;
    error_log  /var/log/nginx/error.log warn;

    # Не раскрывать версию nginx в заголовке Server и на страницах ошибок.
    server_tokens off;

    # «Административная» секция закрыта: отдаём 403 (попадает в журнал).
    location ^~ /admin {
        return 403;
    }

    # Постоянный редирект со старого адреса (даёт 301 в журнале).
    location = /old {
        return 301 /about.html;
    }
}
