server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location /api/status {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /static/ {
        alias /var/www/html/static/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
